<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFT Premium - Payment</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Pyidaungsu', 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
  .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
  .selected { border-color: #f7971e !important; background: rgba(247,151,30,0.1) !important; }
  .loader { border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid #ffd700; border-radius: 50%; width: 18px; height: 18px; animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  input, select { color-scheme: dark; }
  input:focus, select:focus { border-color: rgba(247,151,30,0.5) !important; outline: none; }
</style>
</head>
<body class="py-8 px-4">

<div class="max-w-xl mx-auto glass rounded-3xl shadow-2xl overflow-hidden">

  <!-- Header -->
  <div class="bg-gradient-to-r from-orange-500 to-yellow-500 p-6 text-center">
    <h1 class="text-2xl font-bold text-gray-900">👑 JFT Premium</h1>
    <p class="text-sm text-gray-800 mt-1">ငွေလွှဲပြီး Slip တင်ပါ</p>
  </div>

  <!-- Form -->
  <form id="payForm" class="p-6 space-y-5">

    <!-- Customer Info -->
    <div>
      <label class="block text-sm font-semibold text-white/80 mb-1">📧 Email *</label>
      <input id="email" type="email" required placeholder="your@email.com"
        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 text-sm">
      <p class="text-xs text-white/40 mt-1">Premium Status စစ်ဖို့ လိုအပ်ပါတယ်</p>
    </div>

    <div>
      <label class="block text-sm font-semibold text-white/80 mb-1">👤 အမည် *</label>
      <input id="name" type="text" required placeholder="သင့်အမည်"
        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 text-sm">
    </div>

    <div>
      <label class="block text-sm font-semibold text-white/80 mb-1">📞 ဖုန်းနံပါတ် *</label>
      <input id="phone" type="tel" required placeholder="09XXXXXXXXX"
        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 text-sm">
    </div>

    <!-- Payment Method -->
    <div>
      <label class="block text-sm font-semibold text-white/80 mb-2">💳 Payment Method ရွေးပါ *</label>
      <div class="grid grid-cols-3 gap-2">
        <div class="pay-card glass rounded-xl p-3 cursor-pointer text-center transition border-2 border-transparent" data-m="KPay">
          <div class="font-bold text-blue-400 text-sm">KPay</div>
          <div class="text-[10px] text-white/40">KBZ Pay</div>
        </div>
        <div class="pay-card glass rounded-xl p-3 cursor-pointer text-center transition border-2 border-transparent" data-m="WavePay">
          <div class="font-bold text-yellow-400 text-sm">WavePay</div>
          <div class="text-[10px] text-white/40">Wave Money</div>
        </div>
        <div class="pay-card glass rounded-xl p-3 cursor-pointer text-center transition border-2 border-transparent" data-m="PayPal">
          <div class="font-bold text-blue-300 text-sm">PayPal</div>
          <div class="text-[10px] text-white/40">International</div>
        </div>
      </div>
      <input type="hidden" id="method">
    </div>

    <!-- Account Info -->
    <div id="accBox" class="hidden fade">
      <label class="block text-sm font-semibold text-white/80 mb-2">📌 ဒီ Account ကို ငွေလွှဲပါ</label>
      <div class="glass rounded-xl p-4 flex gap-3 items-center">
        <div class="flex-1">
          <p class="text-xs text-white/40" id="accLabel">ဖုန်းနံပါတ်</p>
          <p id="accPhone" class="font-bold text-white text-lg tracking-wider"></p>
          <p id="accName" class="text-sm text-white/60"></p>
        </div>
        <img id="accQR" class="w-24 h-24 rounded-lg bg-white object-contain p-1" />
      </div>
    </div>

    <!-- Trans ID -->
    <div>
      <label class="block text-sm font-semibold text-white/80 mb-1">🔑 Transaction ID (နောက်ဆုံး ၄ လုံး) *</label>
      <input id="transId" type="text" required maxlength="4" placeholder="e.g. 8A3F"
        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 text-sm uppercase tracking-widest">
    </div>

    <!-- Slip -->
    <div>
      <label class="block text-sm font-semibold text-white/80 mb-1">📷 Slip Screenshot *</label>
      <input id="slip" type="file" accept="image/*" required
        class="w-full text-sm text-white/60 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-orange-500/20 file:text-orange-300 file:font-semibold cursor-pointer">
      <img id="preview" class="hidden mt-3 max-h-40 rounded-lg border border-white/10">
    </div>

    <!-- Submit -->
    <button id="btn" type="submit"
      class="w-full bg-gradient-to-r from-orange-500 to-yellow-500 hover:from-orange-600 hover:to-yellow-600 text-gray-900 font-bold py-3.5 rounded-xl shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
      <span id="btnText">📤 Slip တင်မည်</span>
    </button>

    <p id="status" class="text-center text-sm hidden"></p>

    <!-- Order ID Box (Submit ပြီးမှ ပေါ်) -->
    <div id="orderBox" class="hidden fade glass rounded-xl p-5 border border-yellow-500/30">
      <div class="text-center">
        <div class="text-4xl mb-2">🟡</div>
        <h3 class="text-yellow-400 font-bold text-lg">PENDING</h3>
        <p class="text-white/60 text-xs mt-1">ကျွန်ုပ်တို့ သင့် Slip ကို စစ်ဆေးနေပါသည်</p>
      </div>
      <div class="mt-4 p-3 bg-black/20 rounded-lg">
        <p class="text-xs text-white/40 mb-1">📋 Order ID</p>
        <div class="flex items-center gap-2">
          <code id="orderIdShow" class="flex-1 text-yellow-300 font-mono text-sm break-all"></code>
          <button type="button" id="copyBtn" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-white/80 text-xs transition">Copy</button>
        </div>
      </div>
      <p class="text-xs text-white/40 mt-3 text-center">💡 Order ID ကို သိမ်းထားပါ — Status ပြန်စစ်ဖို့ လိုအပ်ပါတယ်</p>
      <a href="payment-status.html" class="block mt-3 text-center py-2.5 bg-white/5 hover:bg-white/10 rounded-lg text-white/70 text-sm transition">📊 Status စစ်ရန် →</a>
    </div>

  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-firestore-compat.js"></script>

<script>
// =============================================
// 🔥 FIREBASE CONFIG
// =============================================
const firebaseConfig = {
  apiKey: "AIzaSyCWiTxC_B_H9GZYhvQc3jdTR_LLsE0gdvA",
  authDomain: "real-jft-premium.firebaseapp.com",
  projectId: "real-jft-premium",
  storageBucket: "real-jft-premium.firebasestorage.app",
  messagingSenderId: "439056027697",
  appId: "1:439056027697:web:b37a75ccf5da922714c510"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// =============================================
// ⚙️ CONFIG
// =============================================
const WORKER_URL = "https://cool-band-2d0f.ooooshine1.workers.dev";

const ACCOUNTS = {
  KPay: {
    phone: "09773883159",
    name:  "Shine Wunna Aung (KPay)",
    qr:    "payment/kpay-qr.jpg"
  },
  WavePay: {
    phone: "09773883159",
    name:  "Shine Wunna Aung (WavePay)",
    qr:    "payment/wavepay-qr.jpg"
  },
  PayPal: {
    phone: "shinewunna@paypal.com",   // ← သင့် PayPal Email/Link
    name:  "PayPal — Shine Wunna Aung",
    qr:    "payment/paypal-qr.jpg"    // ← PayPal QR (ရှိရင်)
  }
};

// ============ DOM ============
const form      = document.getElementById("payForm");
const cards     = document.querySelectorAll(".pay-card");
const methodIn  = document.getElementById("method");
const accBox    = document.getElementById("accBox");
const accLabel  = document.getElementById("accLabel");
const accPhone  = document.getElementById("accPhone");
const accName   = document.getElementById("accName");
const accQR     = document.getElementById("accQR");
const slip      = document.getElementById("slip");
const preview   = document.getElementById("preview");
const btn       = document.getElementById("btn");
const btnText   = document.getElementById("btnText");
const statusEl  = document.getElementById("status");
const orderBox  = document.getElementById("orderBox");
const orderShow = document.getElementById("orderIdShow");

// ============ Method Select ============
cards.forEach(c => {
  c.addEventListener("click", () => {
    cards.forEach(x => x.classList.remove("selected"));
    c.classList.add("selected");
    const m = c.dataset.m;
    methodIn.value = m;

    const a = ACCOUNTS[m];
    accLabel.textContent = (m === "PayPal") ? "PayPal Email" : "ဖုန်းနံပါတ်";
    accPhone.textContent = a.phone;
    accName.textContent  = a.name;
    accQR.src            = a.qr;
    accBox.classList.remove("hidden");
  });
});

// ============ Image Preview ============
slip.addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    preview.src = ev.target.result;
    preview.classList.remove("hidden");
  };
  r.readAsDataURL(f);
});

// ============ Status Helper ============
function showStatus(txt, color = "white") {
  statusEl.textContent = txt;
  statusEl.className = "text-center text-sm mt-2 text-" + color + "/80";
  statusEl.classList.remove("hidden");
}

// ============ Order ID Generator ============
function genOrderId() {
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const rand = Math.floor(1000 + Math.random() * 9000);
  return "ORD-" + ymd + "-" + rand;
}

// ============ Submit ============
form.addEventListener("submit", async e => {
  e.preventDefault();
  orderBox.classList.add("hidden");

  const email   = document.getElementById("email").value.trim().toLowerCase();
  const name    = document.getElementById("name").value.trim();
  const phone   = document.getElementById("phone").value.trim();
  const transId = document.getElementById("transId").value.trim().toUpperCase();
  const method  = methodIn.value;
  const file    = slip.files[0];

  // Validations
  if (!method)  return showStatus("⚠️ Payment Method ရွေးပါ", "red");
  if (!file)    return showStatus("⚠️ Slip ဓာတ်ပုံ တင်ပါ", "red");
  if (transId.length !== 4) return showStatus("⚠️ Trans ID ၄ လုံး ဖြစ်ရမယ်", "red");

  btn.disabled = true;
  btnText.innerHTML = '<span class="loader"></span> Sending...';
  showStatus("📡 ပို့နေသည်...", "white");

  const orderId = genOrderId();

  // 1. Firestore မှာ Order သိမ်း
  try {
    await db.collection("paymentOrders").doc(orderId).set({
      orderId:   orderId,
      email:     email,
      name:      name,
      phone:     phone,
      method:    method,
      transId:   transId,
      status:    "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (err) {
    console.error("Firestore error:", err);
    showStatus("❌ Database Error: " + err.message, "red");
    btn.disabled = false;
    btnText.textContent = "📤 Slip တင်မည်";
    return;
  }

  // 2. Telegram ကို ပို့
  try {
    const fd = new FormData();
    fd.append("name",    name);
    fd.append("phone",   phone);
    fd.append("email",   email);
    fd.append("method",  method);
    fd.append("transId", transId);
    fd.append("orderId", orderId);
    fd.append("photo",   file);

    const res  = await fetch(WORKER_URL, { method: "POST", body: fd });
    const data = await res.json();

    if (!data.ok) {
      console.warn("Telegram warning:", data.msg);
    }
  } catch (err) {
    console.warn("Telegram error (Firestore မှာ သိမ်းပြီးပါပြီ):", err);
  }

  // 3. Success — Order ID ပြ
  orderShow.textContent = orderId;
  orderBox.classList.remove("hidden");
  showStatus("✅ Slip တင်ခြင်း အောင်မြင်ပါသည်!", "green");

  // Form Reset
  form.reset();
  accBox.classList.add("hidden");
  preview.classList.add("hidden");
  cards.forEach(x => x.classList.remove("selected"));
  methodIn.value = "";

  btn.disabled = false;
  btnText.textContent = "📤 Slip တင်မည်";

  // Scroll to order box
  orderBox.scrollIntoView({ behavior: "smooth", block: "center" });
});

// ============ Copy Order ID ============
document.getElementById("copyBtn").addEventListener("click", () => {
  const txt = orderShow.textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "✅ Copied";
    setTimeout(() => btn.textContent = "Copy", 1500);
  });
});
</script>
</body>
</html>
