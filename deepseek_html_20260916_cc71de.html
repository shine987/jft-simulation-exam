<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPay / WavePay Checkout</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Pyidaungsu', system-ui, sans-serif; }
  .selected { border-color: #10b981 !important; background: #ecfdf5; }
  .loader {
    border: 3px solid rgba(255,255,255,0.4); border-top: 3px solid #fff;
    border-radius: 50%; width: 16px; height: 16px;
    animation: spin 0.8s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-50 min-h-screen py-6 px-4">

<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
  <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-5 text-center">
    <h1 class="text-xl font-bold">💳 Payment Slip Upload</h1>
    <p class="text-xs opacity-90 mt-1">KPay / WavePay ငွေလွှဲ Slip တင်ပါ</p>
  </div>

  <form id="form" class="p-5 space-y-5">

    <!-- Payment Method -->
    <div>
      <label class="block text-sm font-semibold mb-2">1. Payment Method ရွေးပါ *</label>
      <div class="grid grid-cols-2 gap-3">
        <div class="pay-card border-2 border-slate-200 rounded-xl p-3 cursor-pointer text-center transition" data-m="KPay">
          <div class="font-bold text-blue-600">KPay</div>
          <div class="text-xs text-slate-500">KBZ Pay</div>
        </div>
        <div class="pay-card border-2 border-slate-200 rounded-xl p-3 cursor-pointer text-center transition" data-m="WavePay">
          <div class="font-bold text-yellow-600">WavePay</div>
          <div class="text-xs text-slate-500">Wave Money</div>
        </div>
      </div>
      <input type="hidden" id="method">
    </div>

    <!-- Account Info -->
    <div id="accBox" class="hidden">
      <label class="block text-sm font-semibold mb-2">2. ဒီ Account ကို ငွေလွှဲပါ</label>
      <div class="bg-slate-50 rounded-xl p-4 flex gap-3 items-center border">
        <div class="flex-1">
          <p class="text-xs text-slate-500">ဖုန်းနံပါတ်</p>
          <p id="accPhone" class="font-bold text-lg"></p>
          <p id="accName" class="text-sm text-slate-600"></p>
        </div>
        <img id="accQR" class="w-24 h-24 rounded border bg-white" />
      </div>
    </div>

    <!-- Customer Info -->
    <div>
      <label class="block text-sm font-semibold mb-1">Customer Name *</label>
      <input id="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="သင့်အမည်">
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">Phone Number *</label>
      <input id="phone" required type="tel" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="09XXXXXXXXX">
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">Trans ID (နောက်ဆုံး ၄ လုံး) *</label>
      <input id="transId" required maxlength="4" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none uppercase tracking-widest" placeholder="e.g. 8A3F">
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">Slip Screenshot *</label>
      <input id="slip" type="file" accept="image/*" required class="w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-emerald-100 file:text-emerald-700 file:font-semibold">
      <img id="preview" class="hidden mt-3 max-h-40 rounded border">
    </div>

    <button id="btn" type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-lg shadow flex items-center justify-center gap-2">
      <span id="btnText">📤 Slip တင်မည်</span>
    </button>

    <p id="status" class="text-center text-sm hidden"></p>
  </form>
</div>

<script>
// ============================================
// ⚙️ ဒီနေရာမှာ သင့် Worker URL ထည့်ပါ
// ============================================
const WORKER_URL = "https://cool-band-2d0f.ooooshine1.workers.dev";

// ============================================
// 🏦 သင့် Account အချက်အလက် — ဒီနေရာမှာ ပြင်ပါ
// ============================================
const ACCOUNTS = {
  KPay: {
    phone: "09-XXXXXXXXX",
    name:  "သင့်အမည် (KPay)",
    qr:    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=KPAY-09XXXXXXXXX"
  },
  WavePay: {
    phone: "09-XXXXXXXXX",
    name:  "သင့်အမည် (WavePay)",
    qr:    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=WAVE-09XXXXXXXXX"
  }
};

// ============ DOM ============
const form      = document.getElementById("form");
const cards     = document.querySelectorAll(".pay-card");
const methodIn  = document.getElementById("method");
const accBox    = document.getElementById("accBox");
const accPhone  = document.getElementById("accPhone");
const accName   = document.getElementById("accName");
const accQR     = document.getElementById("accQR");
const slip      = document.getElementById("slip");
const preview   = document.getElementById("preview");
const btn       = document.getElementById("btn");
const btnText   = document.getElementById("btnText");
const status    = document.getElementById("status");

// ============ Payment Method Select ============
cards.forEach(c => {
  c.addEventListener("click", () => {
    cards.forEach(x => x.classList.remove("selected"));
    c.classList.add("selected");
    const m = c.dataset.m;
    methodIn.value = m;

    const a = ACCOUNTS[m];
    accPhone.textContent = a.phone;
    accName.textContent  = a.name;
    accQR.src            = a.qr;
    accBox.classList.remove("hidden");
  });
});

// ============ Image Preview ============
slip.addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    preview.src = ev.target.result;
    preview.classList.remove("hidden");
  };
  r.readAsDataURL(f);
});

// ============ Status Helper ============
function showStatus(txt, color = "slate") {
  status.textContent = txt;
  status.className = `text-center text-sm mt-2 text-${color}-600`;
  status.classList.remove("hidden");
}

// ============ Form Submit ============
form.addEventListener("submit", async e => {
  e.preventDefault();

  const method = methodIn.value;
  if (!method) {
    showStatus("⚠️ Payment Method ရွေးပါ", "red");
    return;
  }

  const file = slip.files[0];
  if (!file) {
    showStatus("⚠️ Slip ဓာတ်ပုံ တင်ပါ", "red");
    return;
  }

  const fd = new FormData();
  fd.append("name",    document.getElementById("name").value.trim());
  fd.append("phone",   document.getElementById("phone").value.trim());
  fd.append("transId", document.getElementById("transId").value.trim().toUpperCase());
  fd.append("method",  method);
  fd.append("photo",   file);

  btn.disabled = true;
  btnText.innerHTML = '<span class="loader"></span> Sending...';
  showStatus("📡 ပို့နေသည်...", "slate");

  try {
    const res  = await fetch(WORKER_URL, { method: "POST", body: fd });
    const data = await res.json();

    if (data.ok) {
      showStatus("✅ အောင်မြင်ပါသည်!", "emerald");
      alert("✅ Slip တင်ခြင်း အောင်မြင်ပါသည်!");
      form.reset();
      accBox.classList.add("hidden");
      preview.classList.add("hidden");
      cards.forEach(x => x.classList.remove("selected"));
    } else {
      throw new Error(data.msg || "Error");
    }
  } catch (err) {
    showStatus("❌ " + err.message, "red");
    alert("❌ မအောင်မြင်ပါ: " + err.message);
  } finally {
    btn.disabled = false;
    btnText.textContent = "📤 Slip တင်မည်";
  }
});
</script>
</body>
</html>
