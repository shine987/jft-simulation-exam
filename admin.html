<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFT Premium - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 35px 30px 45px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
            background: rgba(255,255,255,0.06);
        }

        .nav-links a.active {
            border-color: rgba(247, 151, 30, 0.3);
            color: #ffd700;
        }

        .btn-logout {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 24px;
            border-radius: 50px;
            color: rgba(255,255,255,0.6);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .admin-title {
            color: #fff;
            font-size: 28px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-title span {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-box .label {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            margin-top: 4px;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-card h2 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 18px;
            border-bottom: 2px solid rgba(247, 151, 30, 0.2);
            padding-bottom: 12px;
        }

        .form-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-group input,
        .form-group select {
            padding: 12px 20px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 14px;
            flex: 1;
            min-width: 180px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(247, 151, 30, 0.4);
            outline: none;
            background: rgba(255,255,255,0.06);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(247, 151, 30, 0.3);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 16px;
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table th {
            text-align: left;
            padding: 12px 14px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        table td {
            padding: 12px 14px;
            color: rgba(255,255,255,0.7);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        table tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .status-badge {
            padding: 3px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-badge.active {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .status-badge.expired {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .search-box input {
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            width: 100%;
            max-width: 300px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: rgba(247, 151, 30, 0.3);
            outline: none;
            background: rgba(255,255,255,0.06);
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.2);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 20px 16px 30px;
            }
            .navbar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .nav-links {
                justify-content: center;
                flex-wrap: wrap;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .form-group {
                flex-direction: column;
            }
            .form-group input,
            .form-group select,
            .btn-primary {
                width: 100%;
            }
            table {
                font-size: 12px;
            }
            table th,
            table td {
                padding: 8px 10px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="navbar">
        <div class="logo-text">👑 JFT Admin</div>
        <div class="nav-links">
            <a href="index.html">🏠 ပင်မ</a>
            <a href="#" class="active">⚙️ Admin Panel</a>
            <button class="btn-logout" id="logoutBtn">🚪 Logout</button>
        </div>
    </div>

    <div class="admin-title">⚙️ <span>Admin Control Panel</span></div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="number" id="totalUsers">0</div>
            <div class="label">👥 စုစုပေါင်း Premium Users</div>
        </div>
        <div class="stat-box">
            <div class="number" id="activeUsers">0</div>
            <div class="label">✅ သက်တမ်းရှိ Users</div>
        </div>
        <div class="stat-box">
            <div class="number" id="expiredUsers">0</div>
            <div class="label">⛔ သက်တမ်းကုန် Users</div>
        </div>
    </div>

    <div class="admin-card">
        <h2>➕ Premium User ထည့်ရန်</h2>
        <div class="form-group">
            <input type="email" id="userEmailInput" placeholder="User Email ထည့်ပါ">
            <select id="monthSelect">
                <option value="1">1 လ</option>
                <option value="3">3 လ</option>
                <option value="6">6 လ</option>
                <option value="12" selected>12 လ</option>
            </select>
            <button class="btn-primary" id="addPremiumBtn">⭐ Premium သတ်မှတ်မည်</button>
        </div>
    </div>

    <div class="admin-card">
        <h2>📋 Premium User စာရင်း</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 User ရှာရန်...">
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>စတင်ရက်</th>
                        <th>သက်တမ်းကုန်ရက်</th>
                        <th>အခြေအနေ</th>
                        <th>လုပ်ဆောင်ချက်</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="5" class="empty-state">စာရင်းမရှိပါ</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-firestore-compat.js"></script>

<script>
// =============================================
// 🔥 FIREBASE CONFIG
// =============================================
const firebaseConfig = {
    apiKey: "AIzaSyCWiTxC_B_H9GZYhvQc3jdTR_LLsE0gdvA",
    authDomain: "real-jft-premium.firebaseapp.com",
    projectId: "real-jft-premium",
    storageBucket: "real-jft-premium.firebasestorage.app",
    messagingSenderId: "439056027697",
    appId: "1:439056027697:web:b37a75ccf5da922714c510"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// =============================================
// 📌 STATE
// =============================================
let allUsers = [];

// =============================================
// 🔐 ADMIN CHECK - oooooshine1@gmail.com ကို Admin အနေနဲ့ သတ်မှတ်ထား
// =============================================
auth.onAuthStateChanged((user) => {
    if (!user || user.email !== 'oooooshine1@gmail.com') {
        window.location.href = 'index.html';
    } else {
        loadUsers();
    }
});

// =============================================
// 🚪 LOGOUT
// =============================================
document.getElementById('logoutBtn').addEventListener('click', () => {
    auth.signOut();
    window.location.href = 'index.html';
});

// =============================================
// ➕ ADD PREMIUM USER
// =============================================
document.getElementById('addPremiumBtn').addEventListener('click', async () => {
    const email = document.getElementById('userEmailInput').value.trim();
    const months = parseInt(document.getElementById('monthSelect').value);

    if (!email) {
        alert('⚠️ ကျေးဇူးပြု၍ User Email ထည့်ပါ။');
        return;
    }

    try {
        const usersRef = db.collection('users');
        const snapshot = await usersRef.where('email', '==', email).get();

        if (snapshot.empty) {
            alert('⛔ ဤ Email ဖြင့် အကောင့် မရှိပါ။');
            return;
        }

        const userDoc = snapshot.docs[0];
        const uid = userDoc.id;

        const startDate = new Date();
        const expiryDate = new Date();
        expiryDate.setMonth(expiryDate.getMonth() + months);

        await db.collection('premiumUsers').doc(uid).set({
            email: email,
            startDate: firebase.firestore.Timestamp.fromDate(startDate),
            expiryDate: firebase.firestore.Timestamp.fromDate(expiryDate),
            months: months,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert(`✅ ${email} ကို ${months} လ Premium သတ်မှတ်ပြီးပါပြီ။`);
        document.getElementById('userEmailInput').value = '';
        loadUsers();

    } catch (error) {
        console.error('Error:', error);
        alert('⚠️ အမှားတစ်ခုဖြစ်ပွားခဲ့ပါသည်: ' + error.message);
    }
});

// =============================================
// 📋 LOAD USERS
// =============================================
async function loadUsers() {
    try {
        const snapshot = await db.collection('premiumUsers')
            .orderBy('startDate', 'desc')
            .get();

        allUsers = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            const expiry = data.expiryDate?.toDate?.() || new Date(data.expiryDate);
            allUsers.push({
                id: doc.id,
                email: data.email,
                startDate: data.startDate?.toDate?.() || new Date(data.startDate),
                expiryDate: expiry,
                months: data.months || 12,
                isActive: expiry > new Date()
            });
        });

        renderTable();
        updateStats();

    } catch (error) {
        console.error('Load users error:', error);
    }
}

// =============================================
// 📊 UPDATE STATS
// =============================================
function updateStats() {
    const total = allUsers.length;
    const active = allUsers.filter(u => u.isActive).length;
    document.getElementById('totalUsers').textContent = total;
    document.getElementById('activeUsers').textContent = active;
    document.getElementById('expiredUsers').textContent = total - active;
}

// =============================================
// 📋 RENDER TABLE
// =============================================
function renderTable() {
    const tbody = document.getElementById('userTableBody');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();

    const filtered = allUsers.filter(user =>
        user.email.toLowerCase().includes(searchTerm)
    );

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">စာရင်းမရှိပါ</td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map(user => `
        <tr>
            <td>${user.email}</td>
            <td>${user.startDate.toLocaleDateString('my-MM')}</td>
            <td>${user.expiryDate.toLocaleDateString('my-MM')}</td>
            <td>
                <span class="status-badge ${user.isActive ? 'active' : 'expired'}">
                    ${user.isActive ? '✅ သက်တမ်းရှိ' : '⛔ သက်တမ်းကုန်'}
                </span>
            </td>
            <td>
                <button class="btn-danger" onclick="deleteUser('${user.id}')">🗑️ ဖျက်မည်</button>
            </td>
        </tr>
    `).join('');
}

// =============================================
// 🗑️ DELETE USER
// =============================================
async function deleteUser(uid) {
    if (!confirm('ဤ User ကို Premium စာရင်းမှ ဖျက်လိုပါသလား?')) return;

    try {
        await db.collection('premiumUsers').doc(uid).delete();
        alert('✅ User ကို ဖျက်ပြီးပါပြီ။');
        loadUsers();
    } catch (error) {
        console.error('Delete error:', error);
        alert('⚠️ ဖျက်ရာတွင် အမှားဖြစ်ပွားခဲ့ပါသည်။');
    }
}

// =============================================
// 🔍 SEARCH
// =============================================
document.getElementById('searchInput').addEventListener('input', renderTable);

// =============================================
// ⏱️ AUTO REFRESH (every 30s)
// =============================================
setInterval(loadUsers, 30000);
</script>

</body>
</html>
